# Starter INA / seeding-agent library for weather-mod screening.
# base_efficiency + optimal_temp_c originate from supercool-water-calculator
# for AgI/NaCl/CaCl2/KI/TEST; mineral/control entries are literature-informed
# placeholders pending validation.

candidates:
  # base_efficiency = peak relative strength vs AgI (AgI = 1.0) when activity tables apply.
  # a(T) from activity_curves.yaml supplies the temperature shape (peak 1 at agent optimum).

  - id: agi
    name: Silver Iodide
    formula: AgI
    agent_class: ice_nucleant
    base_efficiency: 1.0
    optimal_temp_c: -7.0
    lattice_match_score: 0.95
    density_g_cm3: 5.67
    notes: "Baseline glaciogenic INA. Peak relative score = 1.0 by definition. Cost is the main practical downside."
    tags: [baseline, weather-mod, high-confidence, starter-set]
    source: literature+activity_table

  - id: nacl
    name: Sodium Chloride (sea salt proxy)
    formula: NaCl
    agent_class: hygroscopic
    base_efficiency: 0.12
    optimal_temp_c: -12.0
    density_g_cm3: 2.16
    notes: "CCN/hygroscopic contrast on ice track (weak ice activity). Use warm_cloud track to rank as droplet seed."
    tags: [hygroscopic, contrast, sea-salt, starter-set]
    source: literature+activity_table

  - id: cacl2
    name: Calcium Chloride
    formula: CaCl2
    agent_class: hygroscopic
    base_efficiency: 0.18
    optimal_temp_c: -10.0
    density_g_cm3: 2.15
    notes: "Hygroscopic seeder; CCN pathway. Peak strength relative to AgI on ice track is low."
    tags: [hygroscopic]
    source: supercool-water-calculator

  - id: ki
    name: Potassium Iodide
    formula: KI
    agent_class: ice_nucleant
    base_efficiency: 0.55
    optimal_temp_c: -8.0
    density_g_cm3: 3.12
    notes: "Iodide ice nucleant; medium confidence vs AgI."
    tags: [iodide]
    source: supercool-water-calculator

  - id: k_feldspar
    name: Potassium Feldspar
    formula: KAlSi3O8
    agent_class: ice_nucleant
    base_efficiency: 0.58
    optimal_temp_c: -15.0
    lattice_match_score: 0.60
    density_g_cm3: 2.56
    notes: "Strong mineral INA (Atkinson et al. lineage). Peak strength ~0.58 vs AgI; a(T) peaks colder than AgI."
    tags: [baseline, mineral, dust, starter-set]
    source: literature+activity_table

  - id: kaolinite
    name: Kaolinite
    formula: Al2Si2O5(OH)4
    agent_class: ice_nucleant
    base_efficiency: 0.28
    optimal_temp_c: -25.0
    lattice_match_score: 0.35
    density_g_cm3: 2.65
    notes: "Clay INA; colder and weaker than K-feldspar in comparative immersion studies."
    tags: [baseline, mineral, clay, starter-set]
    source: literature+activity_table

  - id: water_control
    name: Pure Water / Homogeneous Control
    formula: H2O
    agent_class: control
    base_efficiency: 0.08
    optimal_temp_c: -38.0
    density_g_cm3: 0.92
    notes: "Homogeneous-freezing control; activity rises only near −35…−38 °C."
    tags: [baseline, control, starter-set]
    source: literature+activity_table

  - id: inert_surface
    name: Inert Hydrophobic Surface
    formula: null
    agent_class: control
    base_efficiency: 0.02
    optimal_temp_c: -35.0
    density_g_cm3: 1.0
    notes: "Non-nucleating surface control for ranking sanity checks."
    tags: [control]
    source: synthetic

# testosterone and other curiosity organics live in experimental_candidates.yaml
# (not loaded by default — keeps demos professional)
