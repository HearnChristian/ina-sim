# Starter INA / seeding-agent library for weather-mod screening.
# base_efficiency + optimal_temp_c originate from supercool-water-calculator
# for AgI/NaCl/CaCl2/KI/TEST; mineral/control entries are literature-informed
# placeholders pending validation.

candidates:
  # base_efficiency = peak relative strength vs AgI (AgI = 1.0) when activity tables apply.
  # a(T) from activity_curves.yaml supplies the temperature shape (peak 1 at agent optimum).

  - id: agi
    name: Silver Iodide
    formula: AgI
    agent_class: ice_nucleant
    base_efficiency: 1.0
    optimal_temp_c: -7.0
    lattice_match_score: 0.95
    density_g_cm3: 5.67
    notes: "Baseline glaciogenic INA. Peak relative score = 1.0 by definition. Cost is the main practical downside."
    tags: [baseline, weather-mod, high-confidence, starter-set]
    source: literature+activity_table

  # Soluble salts. These three are given identical ice-track treatment on
  # purpose: none of them has a measured ice nucleation active site density, so
  # any difference between their ice scores would be invented. They depress the
  # freezing point colligatively and lower water activity, which suppresses
  # freezing (Koop et al. 2000) - see physics/solutes.py.
  - id: nacl
    name: Sodium Chloride (sea salt proxy)
    formula: NaCl
    agent_class: hygroscopic
    base_efficiency: 0.12
    optimal_temp_c: -12.0
    density_g_cm3: 2.16
    notes: "Soluble salt: CCN pathway, no measured ns(T). Use warm_cloud track to rank as droplet seed."
    tags: [hygroscopic, solute, contrast, sea-salt, starter-set]
    source: heuristic-no-ns-data

  - id: cacl2
    name: Calcium Chloride
    formula: CaCl2
    agent_class: hygroscopic
    base_efficiency: 0.12
    optimal_temp_c: -10.0
    density_g_cm3: 2.15
    notes: "Soluble salt: CCN pathway, no measured ns(T). Ice-track score is heuristic only."
    tags: [hygroscopic, solute]
    source: heuristic-no-ns-data

  - id: ki
    name: Potassium Iodide
    formula: KI
    agent_class: hygroscopic
    base_efficiency: 0.12
    optimal_temp_c: -10.0
    density_g_cm3: 3.12
    notes: >-
      Soluble salt, NOT an ice nucleant. Reclassified from ice_nucleant in
      v0.3.0: KI dissolves, and sharing an iodide ion with AgI confers no ice
      nucleation ability. The earlier ice_nucleant class and 0.55 efficiency
      came from a supercooled-water calculator where KI was a freezing-point
      depressant, i.e. the opposite effect.
    tags: [hygroscopic, solute, iodide]
    source: heuristic-no-ns-data

  - id: k_feldspar
    name: Potassium Feldspar
    formula: KAlSi3O8
    agent_class: ice_nucleant
    base_efficiency: 0.58
    optimal_temp_c: -15.0
    lattice_match_score: 0.60
    density_g_cm3: 2.56
    notes: "Strong mineral INA (Atkinson et al. lineage). Peak strength ~0.58 vs AgI; a(T) peaks colder than AgI."
    tags: [baseline, mineral, dust, starter-set]
    source: literature+activity_table

  - id: kaolinite
    name: Kaolinite
    formula: Al2Si2O5(OH)4
    agent_class: ice_nucleant
    base_efficiency: 0.28
    optimal_temp_c: -25.0
    lattice_match_score: 0.35
    density_g_cm3: 2.65
    notes: "Clay INA; colder and weaker than K-feldspar in comparative immersion studies."
    tags: [baseline, mineral, clay, starter-set]
    source: literature+activity_table

  - id: water_control
    name: Pure Water / Homogeneous Control
    formula: H2O
    agent_class: control
    base_efficiency: 0.08
    optimal_temp_c: -38.0
    density_g_cm3: 0.92
    notes: "Homogeneous-freezing control; activity rises only near −35…−38 °C."
    tags: [baseline, control, starter-set]
    source: literature+activity_table

  - id: inert_surface
    name: Inert Hydrophobic Surface
    formula: null
    agent_class: control
    base_efficiency: 0.02
    optimal_temp_c: -35.0
    density_g_cm3: 1.0
    notes: "Non-nucleating surface control for ranking sanity checks."
    tags: [control]
    source: synthetic

# testosterone and other curiosity organics live in experimental_candidates.yaml
# (not loaded by default — keeps demos professional)
