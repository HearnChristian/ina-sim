# Starter INA / seeding-agent library for weather-mod screening.
# base_efficiency + optimal_temp_c originate from supercool-water-calculator
# for AgI/NaCl/CaCl2/KI/TEST; mineral/control entries are literature-informed
# placeholders pending validation.

candidates:
  - id: agi
    name: Silver Iodide
    formula: AgI
    agent_class: ice_nucleant
    base_efficiency: 0.85
    optimal_temp_c: -7.0
    lattice_match_score: 0.95
    density_g_cm3: 5.67
    notes: "Industry classic ice nucleant; lattice match to ice Ih. Always-on benchmark."
    tags: [baseline, weather-mod, high-confidence]
    source: supercool-water-calculator+literature

  - id: nacl
    name: Sodium Chloride
    formula: NaCl
    agent_class: hygroscopic
    base_efficiency: 0.65
    optimal_temp_c: -12.0
    density_g_cm3: 2.16
    notes: "Hygroscopic seeder; different mechanism than AgI. Teaching contrast."
    tags: [hygroscopic, contrast]
    source: supercool-water-calculator

