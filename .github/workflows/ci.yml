name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest -q --cov=ina_sim --cov-report=term-missing
      - name: Ruff
        run: ruff check src tests tools
      - name: Mypy
        run: mypy
      - name: Self-check
        run: ina-sim doctor

  # Prove it is a package someone else can install, not just a checkout that
  # happens to run on this machine.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/ina-sim --version
          /tmp/fresh/bin/ina-sim ns --list
          /tmp/fresh/bin/ina-sim validate
          /tmp/fresh/bin/ina-sim doctor

  # The empirical layer has to defend itself on every push: the anchors are
  # re-derived from the shipped parameterizations, and the AgI fit is
  # recomputed from its dataset. A coefficient typo fails the build here.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate against published claims
        run: ina-sim validate
      - name: Derived AgI fit still matches its dataset
        run: python tools/fit_agi_ns.py --check
      - name: Generated docs match the registry
        run: python tools/gen_docs.py --check
      - name: Registry inventory
        run: ina-sim ns --list
      - name: Intercomparison of the published fits
        run: ina-sim compare --range=-35:-10:5
      - name: Empirical ranking covers every parameterization
        run: ina-sim rank --temp -20
      - name: Reference figures build offline
        run: ina-sim figures --out /tmp/reference-figures.html
      - name: Monte Carlo is reproducible
        run: |
          ina-sim uncertainty --id desert_dust_niemand2012 --mode 1.0:0.8:1.9 \
            --temp -20 --samples 500 --json > /tmp/mc1.json
          ina-sim uncertainty --id desert_dust_niemand2012 --mode 1.0:0.8:1.9 \
            --temp -20 --samples 500 --json > /tmp/mc2.json
          diff /tmp/mc1.json /tmp/mc2.json
