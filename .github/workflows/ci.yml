name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests tools
      - name: Mypy
        run: mypy

  # The empirical layer has to defend itself on every push: the anchors are
  # re-derived from the shipped parameterizations, and the AgI fit is
  # recomputed from its dataset. A coefficient typo fails the build here.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate against published claims
        run: ina-sim validate
      - name: Derived AgI fit still matches its dataset
        run: python tools/fit_agi_ns.py --check
      - name: Generated docs match the registry
        run: python tools/gen_docs.py --check
      - name: Registry inventory
        run: ina-sim ns --list
      - name: Intercomparison of the published fits
        run: ina-sim compare --range=-35:-10:5
      - name: Empirical ranking covers every parameterization
        run: ina-sim rank --temp -20
